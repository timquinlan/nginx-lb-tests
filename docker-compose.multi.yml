x-controller-common: &controller-common
  build:
    context: .
    dockerfile: controller/Dockerfile
  depends_on:
    - backend-1
    - backend-2
    - backend-3
    - backend-4
    - backend-5
  networks:
    - nginx-lb-tests
  deploy:
    resources:
      limits:
        cpus: "2.0"

x-controller-env: &controller-env
  DEPLOY_MODE: full
  TICK_SECONDS: "${TICK_SECONDS:-10}"
  ACO_EVAPORATION_RATE: "${ACO_EVAPORATION_RATE:-0.1}"
  ACO_DEPOSIT_CONSTANT: "${ACO_DEPOSIT_CONSTANT:-10.0}"
  WORKER_PROCESSES_COUNT: "${WORKER_PROCESSES_COUNT:-2}"

services:
  # Same 5 backend definitions as docker-compose.full.yml, kept in sync by
  # copy (same established workflow as editing these values for any other
  # backend-config experiment in this project -- see that file's own
  # comment block). Only 5 backend containers exist regardless of how many
  # NGINX instances sit in front of them below -- the whole point of this
  # topology is multiple independent instances competing for the SAME
  # shared pool, not tripling the backends too. Degradation logs stay
  # written to the plain ./logs directory (not split per instance) since
  # there's only ever one set of backends -- see docker-compose.full.yml's
  # own comment block for the LATENCY_MIN_MS/MAX_MS profile in use.
  backend-1:
    build:
      context: ./backend
    environment:
      LATENCY_MIN_MS: "150"
      LATENCY_MAX_MS: "200"
      DEGRADATION_MEAN_DWELL_SECONDS: "${DEGRADATION_MEAN_DWELL_SECONDS:-40}"
      DEGRADATION_OFFSET_MIN_MS: "${DEGRADATION_OFFSET_MIN_MS:--10}"
      DEGRADATION_OFFSET_MAX_MS: "${DEGRADATION_OFFSET_MAX_MS:-250}"
      DEGRADATION_LOG_PATH: /var/log/nginx-lb-tests/degradation-backend-1.log
    volumes:
      - ./logs:/var/log/nginx-lb-tests
    networks:
      - nginx-lb-tests

  backend-2:
    build:
      context: ./backend
    environment:
      LATENCY_MIN_MS: "150"
      LATENCY_MAX_MS: "350"
      DEGRADATION_MEAN_DWELL_SECONDS: "${DEGRADATION_MEAN_DWELL_SECONDS:-80}"
      DEGRADATION_OFFSET_MIN_MS: "${DEGRADATION_OFFSET_MIN_MS:--10}"
      DEGRADATION_OFFSET_MAX_MS: "${DEGRADATION_OFFSET_MAX_MS:-250}"
      DEGRADATION_LOG_PATH: /var/log/nginx-lb-tests/degradation-backend-2.log
    volumes:
      - ./logs:/var/log/nginx-lb-tests
    networks:
      - nginx-lb-tests

  backend-3:
    build:
      context: ./backend
    environment:
      LATENCY_MIN_MS: "160"
      LATENCY_MAX_MS: "190"
      DEGRADATION_MEAN_DWELL_SECONDS: "${DEGRADATION_MEAN_DWELL_SECONDS:-40}"
      DEGRADATION_OFFSET_MIN_MS: "${DEGRADATION_OFFSET_MIN_MS:--10}"
      DEGRADATION_OFFSET_MAX_MS: "${DEGRADATION_OFFSET_MAX_MS:-250}"
      DEGRADATION_LOG_PATH: /var/log/nginx-lb-tests/degradation-backend-3.log
    volumes:
      - ./logs:/var/log/nginx-lb-tests
    networks:
      - nginx-lb-tests

  backend-4:
    build:
      context: ./backend
    environment:
      LATENCY_MIN_MS: "220"
      LATENCY_MAX_MS: "450"
      DEGRADATION_MEAN_DWELL_SECONDS: "${DEGRADATION_MEAN_DWELL_SECONDS:-80}"
      DEGRADATION_OFFSET_MIN_MS: "${DEGRADATION_OFFSET_MIN_MS:--10}"
      DEGRADATION_OFFSET_MAX_MS: "${DEGRADATION_OFFSET_MAX_MS:-250}"
      DEGRADATION_LOG_PATH: /var/log/nginx-lb-tests/degradation-backend-4.log
    volumes:
      - ./logs:/var/log/nginx-lb-tests
    networks:
      - nginx-lb-tests

  backend-5:
    build:
      context: ./backend
    environment:
      LATENCY_MIN_MS: "350"
      LATENCY_MAX_MS: "600"
      DEGRADATION_MEAN_DWELL_SECONDS: "${DEGRADATION_MEAN_DWELL_SECONDS:-120}"
      DEGRADATION_OFFSET_MIN_MS: "${DEGRADATION_OFFSET_MIN_MS:--10}"
      DEGRADATION_OFFSET_MAX_MS: "${DEGRADATION_OFFSET_MAX_MS:-250}"
      DEGRADATION_LOG_PATH: /var/log/nginx-lb-tests/degradation-backend-5.log
    volumes:
      - ./logs:/var/log/nginx-lb-tests
    networks:
      - nginx-lb-tests

  # 3 fully independent NGINX+controller instances, all pointed at the same
  # 5 backends above -- each runs today's complete 6-path config (rr/
  # random/random2/leastconn/aco/mc) with its own zones, its own aco/mc
  # sampling state, and its own traffic_generator.py invocation. See
  # EXPERIMENTS.md, "3x identical NGINX instances / many-LB test", for why:
  # today's single-instance/6-zone setup already has inter-*algorithm*
  # blindness (the motivation for the contention-cap feature), but can't
  # reproduce multiple independent instances of the *same* algorithm
  # competing for one pool -- there's only one zone per algorithm. This is
  # what makes that possible for the first time.
  #
  # worker_processes pinned to 2/instance (down from the single-instance
  # default of 4) and an explicit CPU limit per instance -- 3 instances x
  # 4 workers would be 12 NGINX worker processes alone on an 8-core host,
  # and unequal/unpredictable CPU contention between "identical" instances
  # would itself be a confound (one instance looking worse for scheduler
  # reasons, not algorithmic ones). deploy.resources.limits.cpus requires
  # Docker Compose V2 (`docker compose`, not the standalone `docker-compose`
  # v1 binary) to apply outside Swarm mode.
  controller-1:
    <<: *controller-common
    environment:
      <<: *controller-env
      # Exactly one instance owns backend-contention-cap sizing/apply --
      # AdjustableLimiter is one instance per backend *container*, shared
      # by every controller that calls it, so several instances calling
      # apply_contention_level independently would race (last POST wins),
      # each sized off only its own third of the traffic -- see
      # traffic_generator.py's apply_contention_level docstring and
      # EXPERIMENTS.md for the worked example of why that undersizes the
      # cap for the real combined arrival rate. Pass
      # --contention-total-rps <aggregate rps> on THIS instance's
      # traffic_generator.py invocation when using --contention.
      CONTENTION_OWNER: "true"
    volumes:
      - ./upstream-hosts.txt:/app/upstream-hosts.txt:ro
      - ./nginx-conf-instance-1:/var/lib/nginx-lb-tests/nginx-conf.d
      - ./logs-instance-1:/var/log/nginx-lb-tests
    ports:
      # Only instance 1 published to the host, for manual curl/debugging --
      # the traffic generator (running inside each container, exactly like
      # today's single-instance workflow) reaches all 3 instances over the
      # internal Docker network by service name, no host ports needed for
      # the automated flow.
      - "8080:8080"
      - "80:80"

  controller-2:
    <<: *controller-common
    environment:
      <<: *controller-env
      CONTENTION_OWNER: "false"
    volumes:
      - ./upstream-hosts.txt:/app/upstream-hosts.txt:ro
      - ./nginx-conf-instance-2:/var/lib/nginx-lb-tests/nginx-conf.d
      - ./logs-instance-2:/var/log/nginx-lb-tests

  controller-3:
    <<: *controller-common
    environment:
      <<: *controller-env
      CONTENTION_OWNER: "false"
    volumes:
      - ./upstream-hosts.txt:/app/upstream-hosts.txt:ro
      - ./nginx-conf-instance-3:/var/lib/nginx-lb-tests/nginx-conf.d
      - ./logs-instance-3:/var/log/nginx-lb-tests

networks:
  nginx-lb-tests:
