services:
  # Personality restored (see AGENT.md, "backends share a baseline, drift
  # independently" -- shared-baseline was tried, produced a real, useful
  # data point (run 19), but the DEFAULT reverted back to distinct
  # personalities: if every backend performs identically on average, the
  # honest pitch is "just use anycast" -- there's no persistent structural
  # difference left to learn. Distinct personalities represent a
  # realistic heterogeneous-hardware fleet (some backends permanently
  # weaker, e.g. older CPUs deliberately kept as low-weight backups) --
  # exactly the kind of persistent asymmetry anycast's network-proximity
  # routing can't see, which is where this project's approach earns its
  # keep instead of duplicating what anycast already gives you for free.
  #
  # LATENCY_MIN_MS/MAX_MS below are each backend's fixed personality
  # range again (hardcoded per backend, not a shared override -- a
  # single shared variable can't express 5 different defaults). To
  # "level them out" for an identical-node run (e.g. to reproduce the
  # shared-baseline methodology check), edit these 5 values directly for
  # that run rather than looking for an env var -- same workflow already
  # used for every other backend-config experiment in this project
  # (halved/doubled latency, wide-range offset, etc.).
  #
  # DEGRADATION_OFFSET_MIN_MS/MAX_MS -- unchanged, still shared across all
  # 5 backends (same distribution; only the independent per-backend
  # *draw* differs). Each backend independently redraws a signed offset
  # (negative = currently faster than baseline, positive = slower) at
  # every dwell transition -- asymmetric range on purpose, more physical
  # room to get worse than to get better.
  #
  # DEGRADATION_MEAN_DWELL_SECONDS (per-backend) controls each backend's
  # own independent reshuffle cadence -- decoupled from TICK_SECONDS,
  # randomized dwell per visit, see AGENT.md.
  #
  # LATENCY_MIN_MS/MAX_MS and DEGRADATION_OFFSET_MIN_MS/MAX_MS below are
  # back to the original "API" latency profile (150-600ms personality
  # table, -10/+250ms degradation offset) as of 2026-07-30, after a
  # detour through a ~50x-scaled-down "high-volume, small-latency"
  # profile (3-12ms) that tested whether resolution (not just raw signal
  # strength) is what separates leastconn/aco/mc: short, fast
  # transactions mean a small W, so a small L=lambda*W leaves little
  # resolution for a connection-count- or latency-based signal to
  # separate healthy from struggling backends regardless of algorithm.
  # Result: leastconn/aco/mc/random2/rr landed within ~1ms of each other
  # at that profile -- see EXPERIMENTS.md, "Algorithm tuning," for the
  # numbers. Reverted here to get separation-capable resolution back.
  backend-1:
    build:
      context: ./backend
    environment:
      LATENCY_MIN_MS: "150"
      LATENCY_MAX_MS: "200"
      DEGRADATION_MEAN_DWELL_SECONDS: "${DEGRADATION_MEAN_DWELL_SECONDS:-40}"
      DEGRADATION_OFFSET_MIN_MS: "${DEGRADATION_OFFSET_MIN_MS:--10}"
      DEGRADATION_OFFSET_MAX_MS: "${DEGRADATION_OFFSET_MAX_MS:-250}"
      DEGRADATION_LOG_PATH: /var/log/nginx-lb-tests/degradation-backend-1.log
    volumes:
      - ./logs:/var/log/nginx-lb-tests
    networks:
      - nginx-lb-tests

  backend-2:
    build:
      context: ./backend
    environment:
      LATENCY_MIN_MS: "150"
      LATENCY_MAX_MS: "350"
      DEGRADATION_MEAN_DWELL_SECONDS: "${DEGRADATION_MEAN_DWELL_SECONDS:-80}"
      DEGRADATION_OFFSET_MIN_MS: "${DEGRADATION_OFFSET_MIN_MS:--10}"
      DEGRADATION_OFFSET_MAX_MS: "${DEGRADATION_OFFSET_MAX_MS:-250}"
      DEGRADATION_LOG_PATH: /var/log/nginx-lb-tests/degradation-backend-2.log
    volumes:
      - ./logs:/var/log/nginx-lb-tests
    networks:
      - nginx-lb-tests

  backend-3:
    build:
      context: ./backend
    environment:
      LATENCY_MIN_MS: "160"
      LATENCY_MAX_MS: "190"
      DEGRADATION_MEAN_DWELL_SECONDS: "${DEGRADATION_MEAN_DWELL_SECONDS:-40}"
      DEGRADATION_OFFSET_MIN_MS: "${DEGRADATION_OFFSET_MIN_MS:--10}"
      DEGRADATION_OFFSET_MAX_MS: "${DEGRADATION_OFFSET_MAX_MS:-250}"
      DEGRADATION_LOG_PATH: /var/log/nginx-lb-tests/degradation-backend-3.log
    volumes:
      - ./logs:/var/log/nginx-lb-tests
    networks:
      - nginx-lb-tests

  backend-4:
    build:
      context: ./backend
    environment:
      LATENCY_MIN_MS: "220"
      LATENCY_MAX_MS: "450"
      DEGRADATION_MEAN_DWELL_SECONDS: "${DEGRADATION_MEAN_DWELL_SECONDS:-80}"
      DEGRADATION_OFFSET_MIN_MS: "${DEGRADATION_OFFSET_MIN_MS:--10}"
      DEGRADATION_OFFSET_MAX_MS: "${DEGRADATION_OFFSET_MAX_MS:-250}"
      DEGRADATION_LOG_PATH: /var/log/nginx-lb-tests/degradation-backend-4.log
    volumes:
      - ./logs:/var/log/nginx-lb-tests
    networks:
      - nginx-lb-tests

  backend-5:
    build:
      context: ./backend
    environment:
      LATENCY_MIN_MS: "350"
      LATENCY_MAX_MS: "600"
      DEGRADATION_MEAN_DWELL_SECONDS: "${DEGRADATION_MEAN_DWELL_SECONDS:-120}"
      DEGRADATION_OFFSET_MIN_MS: "${DEGRADATION_OFFSET_MIN_MS:--10}"
      DEGRADATION_OFFSET_MAX_MS: "${DEGRADATION_OFFSET_MAX_MS:-250}"
      DEGRADATION_LOG_PATH: /var/log/nginx-lb-tests/degradation-backend-5.log
    volumes:
      - ./logs:/var/log/nginx-lb-tests
    networks:
      - nginx-lb-tests

  # Adding a 6th+ backend for local dev means adding both a service here
  # (full mode builds/runs the container) and a line in upstream-hosts.txt
  # (the controller's source of truth). Only full mode needs the former --
  # docker-compose.controller.yml scales purely by editing the hosts file,
  # since it never builds backend containers. See AGENT.md "Scaling
  # Roadmap".
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    environment:
      DEPLOY_MODE: full
      # Default 10s, not the original 60s -- live-tested (see AGENT.md,
      # "dwell-to-window ratio"): at the current DEGRADATION_MEAN_DWELL_SECONDS
      # defaults, 60s and 20s ticks both showed cracks or outright collapsed
      # significance, while 10s gave clean, fully-significant separation for
      # both algorithms across a real 10-minute/150k-request run.
      TICK_SECONDS: "${TICK_SECONDS:-10}"
      ACO_EVAPORATION_RATE: "${ACO_EVAPORATION_RATE:-0.1}"
      ACO_DEPOSIT_CONSTANT: "${ACO_DEPOSIT_CONSTANT:-10.0}"
      # Default 1024 (base image default) runs out at real experiment
      # volume -- see controller/entrypoint.py's WORKER_CONNECTIONS_COUNT
      # comment for the math and the live confirmation.
      WORKER_CONNECTIONS_COUNT: "${WORKER_CONNECTIONS_COUNT:-8192}"
    volumes:
      - ./upstream-hosts.txt:/app/upstream-hosts.txt:ro
      # Bind mounts to plain host directories, not named volumes -- so logs
      # and generated confs are directly browsable from the Mac side
      # (`ls ./logs`, feed straight into Phase 4 analysis scripts) without
      # `docker cp`/`docker exec`. Created on first run if missing.
      - ./nginx-conf:/var/lib/nginx-lb-tests/nginx-conf.d
      - ./logs:/var/log/nginx-lb-tests
    ports:
      - "8080:8080"
      - "80:80"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - backend-4
      - backend-5
    networks:
      - nginx-lb-tests

networks:
  nginx-lb-tests:
