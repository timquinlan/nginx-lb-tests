services:
  # Controller only -- no backend containers are built or started. Point
  # upstream-hosts.txt at reachable external hosts/IPs before starting this.
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    environment:
      DEPLOY_MODE: external
      # Default 10s, matching docker-compose.full.yml -- see AGENT.md,
      # "dwell-to-window ratio". That finding was calibrated against this
      # project's own simulated backend degradation model specifically;
      # for real external hosts, pick --tick based on how fast their
      # actual latency conditions change, not this default blindly.
      TICK_SECONDS: "${TICK_SECONDS:-10}"
      ACO_EVAPORATION_RATE: "${ACO_EVAPORATION_RATE:-0.1}"
      ACO_DEPOSIT_CONSTANT: "${ACO_DEPOSIT_CONSTANT:-10.0}"
    volumes:
      - ./upstream-hosts.txt:/app/upstream-hosts.txt:ro
      # Same host paths as docker-compose.full.yml by design -- switching
      # deployment modes against the same generated-conf/log data is
      # intentional, not accidental sharing.
      - ./nginx-conf:/var/lib/upstream-rl/nginx-conf.d
      - ./logs:/var/log/upstream-rl
    ports:
      - "8080:8080"
      - "80:80"
    networks:
      - upstream-rl

networks:
  upstream-rl:
